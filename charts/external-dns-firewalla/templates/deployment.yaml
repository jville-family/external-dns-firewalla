apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "external-dns-firewalla.fullname" . }}
  labels:
    {{- include "external-dns-firewalla.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "external-dns-firewalla.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "external-dns-firewalla.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "external-dns-firewalla.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: webhook
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "external-dns-firewalla.secretName" . }}
                  key: HMAC_SECRET
            - name: ALLOWED_DOMAINS
              value: {{ .Values.config.allowedDomains | quote }}
            - name: LISTENER_URL
              value: {{ .Values.config.listenerURL | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: WEBHOOK_ADDR
              value: {{ .Values.config.webhookAddr | quote }}
            - name: HEALTH_ADDR
              value: {{ .Values.config.healthAddr | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
