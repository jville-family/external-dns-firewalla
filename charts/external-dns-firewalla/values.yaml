replicaCount: 1

image:
  repository: ghcr.io/jville-family/external-dns-firewalla
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# HMAC secret shared with the Firewalla listener
secret:
  create: true
  # existingSecret: ""  # set to use an existing Secret instead
  hmacSecret: ""        # required when create=true (set via --set or values overlay)

config:
  listenerURL: "http://192.168.1.1:10053"
  allowedDomains: "app.lan,k8s.local"
  logLevel: warn
  webhookAddr: ":8888"
  healthAddr: ":8080"

service:
  type: ClusterIP
  webhookPort: 8888
  healthPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: false
  # ingress from external-dns pods only when enabled
  ingressLabels:
    app.kubernetes.io/name: external-dns

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
